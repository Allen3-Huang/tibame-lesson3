name: CI

on:
  push:
    branches: ["**"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test-api:
    name: Test API (Jest + Coverage)
    needs: lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vms
          POSTGRES_PASSWORD: vms
          POSTGRES_DB: vms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://vms:vms@localhost:5432/vms?schema=public
      TEST_DATABASE_URL: postgresql://vms:vms@localhost:5432/vms_test?schema=public
      JWT_SECRET: ci-test-jwt-secret-must-be-32-chars
      COOKIE_SECRET: ci-test-cookie-secret-string-here
      API_PORT: 8090
      WEB_ORIGIN: http://localhost:3087

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run API tests with coverage
        run: npm run test --workspace apps/api -- --coverage

      - name: Upload API coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage-report
          path: apps/api/coverage/
          retention-days: 30

  test-web:
    name: Test Web (Vitest + Coverage)
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run web tests with coverage
        run: npm run test --workspace apps/web -- --coverage

      - name: Upload web coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-coverage-report
          path: apps/web/coverage/
          retention-days: 30
